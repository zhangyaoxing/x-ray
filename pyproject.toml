[build-system]
requires = ["setuptools==84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-x-ray"
version = "2.0.1"
description = "MongoDB diagnostics toolkit with health checks and log analysis"
readme = "README.md"
requires-python = ">=3.10,<4"
license = { file = "LICENSE" }
authors = [{ name = "Yaoxing Zhang" }]
keywords = ["mongodb", "diagnostics", "healthcheck", "log-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "pymongo==4.17.0",
  "Markdown==3.10.3",
  "openai==3.8.0",
  "python-dotenv==1.2.3",
  "WeasyPrint==69.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.6",
  "pylint==4.0.8",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pluggy==1.6.0",
  "iniconfig==2.3.0",
  "tomli==2.4.1",
  "pyinstaller==6.22.2",
  "pyinstaller-hooks-contrib>=2026.6",
  "macholib==1.16.4",
  "altgraph==0.17.5",
  "playwright==1.62.0",
  "types-Markdown==3.10.2.20260712",
]
[project.urls]
Homepage = "https://github.com/mongodb-ps/ce-mongo-x-ray"
Repository = "https://github.com/mongodb-ps/ce-mongo-x-ray"
Issues = "https://github.com/mongodb-ps/ce-mongo-x-ray/issues"

[tool.setuptools]
include-package-data = false

[project.scripts]
x-ray = "mongo_x_ray.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mongo_x_ray*"]
exclude = ["tests*", "output*", "misc*", "build*", "dist*"]

[tool.setuptools.package-data]
"mongo_x_ray" = [
  "config.json",
  "compatibility_matrix.json",
  "templates/**/full.html",
  "templates/**/script.js",
  "templates/**/style.css",
  "templates/css/shared.css",
  "templates/**/snippets/*[!w].js",
  "templates/js/*[!w].js",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Lint gate: pycodestyle + pyflakes (E, F) + isort (I).
# E501 (line-too-long) is not enforced.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mongo_x_ray", "mongo_x_ray_ftdc", "mongo_x_ray_gmd", "mongo_x_ray_hc", "mongo_x_ray_log", "mongo_x_ray_risk"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
extraPaths = [
  "src",
  "plugins/mongo-x-ray-ftdc/src",
  "plugins/mongo-x-ray-log/src",
  "plugins/mongo-x-ray-gmd/src",
  "plugins/mongo-x-ray-hc/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers", "--color=yes", "-ra"]
markers = [
  'slow: marks tests as slow (deselect via -m "not slow")',
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
]
minversion = "6.0"
console_output_style = "progress"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
